name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android SDK Platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null
      - name: Test
        run: ./gradlew :shared:testAndroidHostTest
      - name: Lint
        run: ./gradlew :androidApp:lintDebug
      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: wadachi-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 7

  ios:
    name: iOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Test
        run: ./gradlew :shared:iosSimulatorArm64Test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build app for simulator
        working-directory: iosApp
        run: |
          xcodegen generate
          xcodebuild build \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ../build/ios \
            CODE_SIGNING_ALLOWED=NO
