name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Install Android SDK Platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null

      - name: Derive version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag must look like v1.2.3 (got $tag)"
            exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          echo "name=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "code=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set. See README (Release) for setup."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          WADACHI_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          WADACHI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WADACHI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WADACHI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :androidApp:assembleRelease \
            -Pwadachi.versionName=${{ steps.version.outputs.name }} \
            -Pwadachi.versionCode=${{ steps.version.outputs.code }}
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "wadachi-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "wadachi-${GITHUB_REF_NAME}.apk" \
            --title "wadachi $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
